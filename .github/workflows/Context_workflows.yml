name: Context testing
on: push

jobs:
  dump_contexts_to_log:
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Dump job context
        env:
          JOB_CONTEXT: ${{ toJson(job) }}
        run: echo "$JOB_CONTEXT"
      - name: Dump steps context
        env:
          STEPS_CONTEXT: ${{ toJson(steps) }}
        run: echo "$STEPS_CONTEXT"
      - name: Dump runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"
      - name: Dump strategy context
        env:
          STRATEGY_CONTEXT: ${{ toJson(strategy) }}
        run: echo "$STRATEGY_CONTEXT"
      - name: Dump matrix context
        env:
          Secret_CONTEXT: ${{ toJson(secrets) }}
        run: echo "$Secret_CONTEXT"

  Docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Docker Build
        run: echo docker build -t ${{env.CONTAINER_REGISTRY}}/$DOCKER_USERNAME/${{vars.IMAGE_NAME}}

      - name: Docker Login
        env:
          DOCKER_PASSWORD: 1234
        run: echo docker login --username=${{vars.DOCKER_USERNAME}} --password=${{secrets.DOCKER_PASSWORD}}

      - name: Docker push
        run: echo docker push $CONTAINER_REGISTRY/${{vars.DOCKER_USERNAME}}/$IMAGE_NAME:latest
  Deploy:
    needs: 
      - Docker
    concurrency:
      group: Prouduction-deploymnt
      cancel-in-progress: false 
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Container
        timeout-minutes: 1 
        run: |
          echo docker run -d -p 8080:8080 $CONTAINER_REGISTRY/${{vars.DOCKER_USERNAME}}/$IMAGE_NAME:latest
          sleep 600s