name: WorkFlow_Secret

on:
    workflow_dispatch:
        inputs:
            user_token: 
                description: 'Enter Password:'
                type: string
                required: true
            is_Correct:
                description: 'is correct'
                type: boolean

jobs:
    secure-job:
        runs-on: ubuntu-latest
        steps:
          - name: Print Massage
            run: echo "Hello we will Checking token"

          - name: Run critical task
            if: github.event.inputs.user_token == ${{github.secrets.RUN_PASSWORD}} && github.event.inputs.is_Correct
            run: echo "Token is correct! Running the secret task"

          - name: Show error message Password
            if: github.event.inputs.user_token != ${{github.secrets.RUN_PASSWORD}} && github.event.inputs.is_Correct
            run: echo "WRONG TOKEN! Access denied"

