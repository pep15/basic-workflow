name: Exploring Variables and Screts

on:
    push:
env:
    CONTAINER_REGISTRY: docker.io
    DOCKER_USERNAME: moath
    IMAGE_NAME: githb_action_nginx
jobs:
    Docker:
        runs-on: ubuntu-latest
        steps:
            - name: Docker Build
              run: echo docker build -t ${{env.CONTAINER_REGISTRY}}/$DOCKER_USERNAME/${{env.IMAGE_NAME}}

            - name: Docker Login
              env:
                DOCKER_PASSWORD: 1234
              run: echo docker login --username=${{env.DOCKER_USERNAME}} --password=$DOCKER_PASSWORD

            - name: Docker push
              run: echo docker push $CONTAINER_REGISTRY/${{env.CONTAINER_REGISTRY}}/$IMAGE_NAME:latest
