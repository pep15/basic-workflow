name: Basic Workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Person to greet"
        default: "World"
        required: true
        type: string
      City:
        description: "Favorite city"
        required: true
        default: "Tupelo"
        type: choice
        options:
          - Saudi Arabi
          - Seattle
          - Tupelo
      fav-color-blue:
        description: "Is your favorite color blue"
        required: true
        type: boolean
jobs:
    greet:
      name: "Greetings, Program!"
      runs-on:
        - ubuntu-latest
      steps:
        - name: "Send greeting"
          run: |
            echo "Hello ${{github.event.inputs.name}}"
            echo "Your favorite city is ${{github.event.inputs.City}}
            echo "Is your favorite color bule: ${{github.event.inputs.fav-color-blue}}"


